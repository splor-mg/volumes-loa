# Versões dos pacotes R a instalar a partir do Bitbucket
# As credenciais devem estar no .env: BITBUCKET_AUTH_USER e BITBUCKET_APP_PASSWORD


# DICAS DE COMANDOS PARA VERIFICAR AS VERSÕES INSTALADAS:

# DENTRO DO CONTAINER (após make docker):
# Todos os pacotes de uma vez:
# Rscript -e "installed.packages()[c('relatorios', 'execucao', 'reest'), 'Version']"

# Um por vez:
# Rscript -e "packageVersion('relatorios')"
# Rscript -e "packageVersion('execucao')"
# Rscript -e "packageVersion('reest')"

# FORA DO CONTAINER (com container rodando):
# Todos os pacotes de uma vez:
# docker exec volumes-loa Rscript -e "installed.packages()[c('relatorios', 'execucao', 'reest'), 'Version']"

# Um por vez:
# docker exec volumes-loa Rscript -e "packageVersion('relatorios')"
# docker exec volumes-loa Rscript -e "packageVersion('execucao')"
# docker exec volumes-loa Rscript -e "packageVersion('reest')"


repositorio_base: "bitbucket.org/dcgf"

pacotes:
  - nome: "relatorios"
    versao: "v0.7.64"
    repo: "relatorios"
  - nome: "execucao"
    versao: "v0.5.27"
    repo: "execucao"
  - nome: "reest"
    versao: "v0.2.8"
    repo: "reest"


