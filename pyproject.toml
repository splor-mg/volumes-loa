# ====================================================================
# Volumes LOA - pyproject
# Descrição: Configuração do Poetry e scripts de CLI
# Uso rápido: poetry run <script>
# --------------------------------------------------------------------
# TOC (comentada)
# 1) Metadados do projeto
# 2) Dependências (runtime e dev)
# 3) Scripts CLI (agrupados por tema)
# 4) Build system
# 5) Ferramentas (black, flake8, mypy)
# ====================================================================

[tool.poetry]
name = "volumes-loa"
version = "0.1.0"
description = "Sistema automatizado para geração de PDFs dos volumes da Lei Orçamentária Anual (LOA)"
authors = ["Splor MG <aid@planejamento.mg.gov.br>"]
readme = "README.md"
packages = [{include = "utils"}]

[tool.poetry.dependencies]
python = "^3.8.1"
frictionless = {extras = ["excel", "html"], version = "^4.0.0"}
pandas = {extras = ["excel", "html"], version = "^2.0.0"}
numpy = "^1.24.0"
tomli = "^2.0.0"
typer = "^0.9.0"
typing-extensions = "^4.0.0"
pyyaml = "^6.0.0"

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"
pytest = "^7.0.0"

[tool.poetry.scripts]

# ====================================================================
# 3) Scripts CLI (agrupados por tema - espelhando Makefile)
# ====================================================================

# --------------------------------------------------------------------
# 3.1) Utilitários (help, config, snapshot, info, validate)
# --------------------------------------------------------------------
config = "utils.config:main"
config-ano-loa = "utils.config_ano_loa:main"
config-etapa-orcamento = "utils.config_etapa_orcamento:main"
config-data-toml = "utils.config_data_toml:main"
config-datapackage = "utils.config_datapackage:main"
config-capa = "utils.config_capa:main"
snapshot = "checks.utils:snapshot"

# --------------------------------------------------------------------
# 3.2) Docker & RStudio
# --------------------------------------------------------------------
extract-info = "utils.extract_info:main"
install-pacotes = "utils.install_pacotes:main"

# --------------------------------------------------------------------
# 3.3) Housekeeping
# --------------------------------------------------------------------
unicode-replace = "utils.unicode_replace:main"

# --------------------------------------------------------------------
# 3.4) Detecção de plataforma e fontes
# --------------------------------------------------------------------
detect-platform = "utils.detect_plattform:main"
replace-font-config = "utils.replace_font_config:main"

# --------------------------------------------------------------------
# 3.5) Processamento e checks
# --------------------------------------------------------------------
check-qdd-fonte-95 = "volume7.checks.check_qdd_fonte_95:main"
diff-report = "checks.utils:diff"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true